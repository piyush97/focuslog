<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>focuslog</title>
<style>
  :root { --bg:#1a1b26; --card:#24283b; --fg:#c0caf5; --dim:#7a83a8; --study:#9ece6a; --waste:#f7768e; --other:#565f89; }
  * { box-sizing:border-box; margin:0 }
  body { background:var(--bg); color:var(--fg); font:14px/1.45 "JetBrainsMono Nerd Font", ui-monospace, monospace; padding:24px; }
  h1 { font-size:18px; letter-spacing:.04em } h2 { font-size:12px; color:var(--dim); text-transform:uppercase; letter-spacing:.08em; margin-bottom:10px }
  header { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:20px }
  .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:14px }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:14px }
  .card { background:var(--card); border-radius:10px; padding:16px }
  .big { font-size:28px; font-weight:700 } .study{color:var(--study)} .waste{color:var(--waste)} .dim{color:var(--dim)}
  .bar { height:8px; background:#1f2335; border-radius:4px; overflow:hidden; margin-top:10px }
  .bar > i { display:block; height:100%; background:var(--study) }
  .chart { display:flex; align-items:flex-end; gap:4px; height:140px }
  .col { flex:1; display:flex; flex-direction:column-reverse; gap:1px; height:100% }
  .col i { display:block; border-radius:2px } .lbl { display:flex; gap:4px; font-size:10px; color:var(--dim); margin-top:4px } .lbl span { flex:1; text-align:center }
  ol { list-style:none; padding:0 } li { display:flex; gap:10px; padding:4px 0; border-bottom:1px solid #1f2335 }
  li b { min-width:52px; text-align:right; font-weight:400 } li span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
  .pill { padding:2px 8px; border-radius:99px; background:#1f2335; font-size:12px }
</style>
</head>
<body>
<header><h1>󰑴 focuslog</h1><span id="now" class="pill">…</span></header>
<div class="grid">
  <div class="card"><h2>Study today</h2><div class="big study" id="study">–</div><div class="bar"><i id="goalbar"></i></div><div class="dim" id="goal"></div></div>
  <div class="card"><h2>Wasted today</h2><div class="big waste" id="waste">–</div></div>
  <div class="card"><h2>Focus</h2><div class="big" id="focus">–</div><div class="dim">study ÷ (study + waste)</div></div>
  <div class="card"><h2>Classifier</h2><div class="big" id="jev" style="font-size:18px">–</div><div class="dim">rules → Jev (TypeSafe AI)</div></div>
</div>
<div class="row">
  <div class="card"><h2>Today by hour</h2><div class="chart" id="hours"></div><div class="lbl" id="hlbl"></div></div>
  <div class="card"><h2>Last 7 days</h2><div class="chart" id="week"></div><div class="lbl" id="wlbl"></div></div>
</div>
<div class="row">
  <div class="card"><h2 class="study">Top study</h2><ol id="tstudy"></ol></div>
  <div class="card"><h2 class="waste">Top waste</h2><ol id="twaste"></ol></div>
</div>
<script>
const fmt = s => { s = Math.round(s); return s >= 3600 ? `${Math.floor(s/3600)}h${String(Math.floor(s%3600/60)).padStart(2,"0")}m` : `${Math.floor(s/60)}m` };
const esc = t => String(t).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function chart(el, lbl, rows, labels) {
  const max = Math.max(1, ...rows.map(r => r.study + r.waste + r.neutral));
  el.innerHTML = rows.map(r => `<div class="col" title="study ${fmt(r.study)} · waste ${fmt(r.waste)}">${
    ["study","waste","neutral"].map(k => `<i style="height:${100*r[k]/max}%;background:var(--${k=="neutral"?"other":k})"></i>`).join("")}</div>`).join("");
  lbl.innerHTML = labels.map(l => `<span>${l}</span>`).join("");
}
async function load() {
  const d = await (await fetch("/api/stats")).json(), t = d.today, sw = t.study + t.waste;
  study.textContent = fmt(t.study); waste.textContent = fmt(t.waste);
  focus.textContent = sw ? Math.round(100*t.study/sw) + "%" : "—";
  focus.className = "big " + (sw && t.study/sw < .5 ? "waste" : "study");
  goal.textContent = `goal ${fmt(d.goal)} · ${Math.min(100, Math.round(100*t.study/d.goal))}%`;
  goalbar.style.width = Math.min(100, 100*t.study/d.goal) + "%";
  jev.textContent = d.jev ? "Jev: on" : "Jev: no key"; jev.className = "big " + (d.jev ? "study" : "waste");
  now.textContent = d.now ? `${d.now.cat} · ${d.now.title.slice(0,50)}` : "idle"; now.className = "pill " + (d.now ? d.now.cat : "");
  chart(hours, hlbl, d.hours, d.hours.map((_, i) => i % 3 ? "" : i));
  chart(week, wlbl, d.week, d.week.map(w => w.day.slice(5)));
  // innerHTML is safe here: window titles (the only untrusted text) pass through esc(); charts are numbers only.
  for (const [k, el] of [["study", tstudy], ["waste", twaste]])
    el.innerHTML = d.top[k].map(r => `<li><b>${fmt(r.secs)}</b><span>${esc(r.title)}</span></li>`).join("") || `<li class="dim">nothing yet</li>`;
}
load(); setInterval(load, 10000);
</script>
</body>
</html>
