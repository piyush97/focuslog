<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>focuslog</title>
<style>
  :root { --bg:#1a1b26; --card:#24283b; --fg:#c0caf5; --dim:#a9b1d6; --study:#9ece6a; --waste:#f7768e; --other:#565f89; }
  * { box-sizing:border-box; margin:0 }
  html { min-height:100%; background:var(--bg) }
  body { min-height:100vh; background:var(--bg); color:var(--fg); font:14px/1.45 "JetBrainsMono Nerd Font", ui-monospace, monospace; padding:24px; }
  h1 { font-size:18px; letter-spacing:.04em } h2 { font-size:12px; color:var(--dim); text-transform:uppercase; letter-spacing:.08em; margin-bottom:10px }
  header { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:20px }
  .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:14px }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:14px }
  @media (max-width:760px) { body { padding:14px } .grid { grid-template-columns:repeat(2,1fr) } .row { grid-template-columns:1fr } header { gap:12px } .pill { max-width:60%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap } }
  .card { min-width:0; background:var(--card); border-radius:10px; padding:16px }
  .big { font-size:28px; font-weight:700 } .study{color:var(--study)} .waste{color:var(--waste)} .dim{color:var(--dim)}
  .legend { display:flex; justify-content:flex-end; gap:12px; color:var(--dim); font-size:10px; margin:-12px 0 8px }
  .legend i { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:4px }
  .bar { height:8px; background:#1f2335; border-radius:4px; overflow:hidden; margin-top:10px }
  .bar > i { display:block; height:100%; background:var(--study) }
  header h1 { display:flex; flex-direction:column; gap:2px }
  #demo-label { white-space:nowrap }
  .chart { display:flex; align-items:flex-end; gap:4px; height:140px }
  .col { flex:1; display:flex; flex-direction:column-reverse; gap:1px; height:100% }
  .col i { display:block; border-radius:2px } .lbl { display:flex; gap:4px; font-size:10px; color:var(--dim); margin-top:4px } .lbl span { flex:1; text-align:center }
  ol { list-style:none; padding:0 } li { display:flex; gap:10px; padding:4px 0; border-bottom:1px solid #1f2335 }
  li b { min-width:52px; text-align:right; font-weight:400 } li span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
  .pill { padding:2px 8px; border-radius:99px; background:#1f2335; font-size:12px }
</style>
</head>
<body>
<header><h1>● focuslog <small id="demo-label" style="font-size:11px;color:var(--dim)"></small></h1><span id="now" class="pill">…</span></header>
<div class="grid">
  <div class="card"><h2>Study today</h2><div class="big study" id="study">–</div><div class="bar"><i id="goalbar"></i></div><div class="dim" id="goal"></div></div>
  <div class="card"><h2>Wasted today</h2><div class="big waste" id="waste">–</div></div>
  <div class="card"><h2>Focus</h2><div class="big" id="focus-score">–</div><div class="dim">study ÷ (study + waste)</div></div>
  <div class="card"><h2>Classifier</h2><div class="big" id="jev" style="font-size:18px">–</div><div class="dim">rules → Jev (TypeSafe AI)</div></div>
</div>
<div class="row">
  <div class="card"><h2>Today by hour</h2><div class="legend"><span><i style="background:var(--study)"></i>Study</span><span><i style="background:var(--waste)"></i>Waste</span><span><i style="background:var(--other)"></i>Other</span></div><div class="chart" id="hours"></div><div class="lbl" id="hlbl"></div></div>
  <div class="card"><h2>Last 7 days</h2><div class="legend"><span><i style="background:var(--study)"></i>Study</span><span><i style="background:var(--waste)"></i>Waste</span><span><i style="background:var(--other)"></i>Other</span></div><div class="chart" id="week"></div><div class="lbl" id="wlbl"></div></div>
</div>
<div class="row">
  <div class="card"><h2 class="study">Top study</h2><ol id="tstudy"></ol></div>
  <div class="card"><h2 class="waste">Top waste</h2><ol id="twaste"></ol></div>
</div>
<script>
const byId = id => document.getElementById(id);
const fmt = s => { s = Math.round(s); return s >= 3600 ? `${Math.floor(s/3600)}h${String(Math.floor(s%3600/60)).padStart(2,"0")}m` : `${Math.floor(s/60)}m` };
const esc = t => String(t).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function chart(el, lbl, rows, labels) {
  const max = Math.max(1, ...rows.map(r => r.study + r.waste + r.neutral));
  el.innerHTML = rows.map(r => `<div class="col" title="study ${fmt(r.study)} · waste ${fmt(r.waste)}">${
    ["study","waste","neutral"].map(k => `<i style="height:${100*r[k]/max}%;background:var(--${k=="neutral"?"other":k})"></i>`).join("")}</div>`).join("");
  lbl.innerHTML = labels.map(l => `<span>${l}</span>`).join("");
}
async function load() {
  const study=byId("study"), waste=byId("waste"), focus=byId("focus-score"), goal=byId("goal"),
    goalbar=byId("goalbar"), jev=byId("jev"), now=byId("now"), hours=byId("hours"),
    hlbl=byId("hlbl"), week=byId("week"), wlbl=byId("wlbl"), tstudy=byId("tstudy"), twaste=byId("twaste");
  try {
    const response = await fetch("/api/stats", {cache:"no-store"});
    if (!response.ok) throw new Error("Dashboard unavailable");
    const d = await response.json(), t = d.today, sw = t.study + t.waste;
    const demoLabel=byId("demo-label");
    if (demoLabel) demoLabel.textContent = d.demo ? "DEMO DATA · Fictional activity" : "";
    study.textContent = fmt(t.study); waste.textContent = fmt(t.waste);
    focus.textContent = sw ? Math.round(100*t.study/sw) + "%" : "—";
    focus.className = "big " + (sw && t.study/sw < .5 ? "waste" : "study");
    const pct = d.goal > 0 ? Math.min(100, 100*t.study/d.goal) : 0;
    goal.textContent = d.goal > 0 ? `goal ${fmt(d.goal)} · ${Math.round(pct)}%` : "Daily goal disabled";
    goalbar.style.width = pct + "%";
    jev.textContent = d.jev ? "Jev: configured" : "Rules only"; jev.className = "big " + (d.jev ? "study" : "waste");
    now.textContent = d.now ? `${d.now.cat} · ${d.now.title.slice(0,50)}` : "idle"; now.className = "pill " + (d.now ? d.now.cat : "");
    chart(hours, hlbl, d.hours, d.hours.map((_, i) => i % 3 ? "" : i));
    chart(week, wlbl, d.week, d.week.map(w => w.day.slice(5)));
    // Titles are escaped before HTML insertion; chart markup uses numeric values only.
    for (const [k, el] of [["study", tstudy], ["waste", twaste]])
      el.innerHTML = d.top[k].map(r => `<li><b>${fmt(r.secs)}</b><span>${esc(r.title)}</span></li>`).join("") || `<li class="dim">nothing yet</li>`;
  } catch (error) {
    now.textContent = "Dashboard disconnected — retrying";
    now.className = "pill waste";
  }
}
load(); setInterval(load, 10000);
</script>
</body>
</html>
